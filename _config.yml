# Site Settings
title: Patrick Norwood
tagline: Senior Sales Engineer | MS, CISSP
description: Portfolio of Patrick Norwood - Senior Sales Engineer specializing in Cloud Security, Privileged Access Management, and Infrastructure as Code.
author: Patrick Norwood
#email: patrick.norwood@example.com
url: "https://phnorwood.github.io"
baseurl: ""

# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"

# Pagination (for blog)
paginate: 10
paginate_path: "/blog/page:num/"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Social Media
github_username: phnorwood
linkedin_username: phnorwood

# Navigation Links
navigation:
  - title: About
    url: "#about"
  #- title: Projects
  #  url: "#projects"
  #- title: Blog
  #  url: "#blog"
  - title: Contact
    url: "#contact"
